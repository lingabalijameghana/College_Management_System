
<!DOCTYPE html>
<html>
<head>
    <title>Update Fees | College Management System</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #e9d5ff);
            margin: 0;
            padding: 25px;
            min-height: 100vh;
        }

        .navbar {
            background: #312e81;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 10px 13px;
            border-radius: 6px;
            font-size: 14px;
        }

        .navbar a:hover {
            background: #6366f1;
        }

        .container {
            max-width: 500px;
            margin: 35px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            color: #312e81;
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #333;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #4338ca;
            box-shadow: 0 0 5px rgba(67,56,202,0.3);
        }

        button {
            width: 100%;
            padding: 13px;
            background: #4338ca;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #312e81;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            color: #166534;
            font-size: 16px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #4338ca;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="dashboard.html">Dashboard</a>
        <a href="student.html">Add Student</a>
        <a href="students.html">View Students</a>
        <a href="faculty.html">Add Faculty</a>
        <a href="faculties.html">View Faculty</a>
        <a href="course.html">Add Course</a>
        <a href="courses.html">View Courses</a>
        <a href="attendance.html">Add Attendance</a>
        <a href="attendances.html">View Attendance</a>
        <a href="fee.html">Add Fee</a>
        <a href="fees.html">View Fees</a>
    </nav>

    <div class="container">

        <h2>Update Student Fees</h2>

        <form id="updateForm">

            <label>Fee ID:</label>
            <input type="number" id="fee_id" required>

            <label>Total Fee:</label>
            <input type="number" id="total_fee" required>

            <label>Paid Amount:</label>
            <input type="number" id="paid_amount" required>

            <label>Payment Date:</label>
            <input type="date" id="payment_date" required>

            <label>Payment Status:</label>
            <select id="payment_status" required>
                <option value="">Select Status</option>
                <option value="Paid">Paid</option>
                <option value="Pending">Pending</option>
                <option value="Partial">Partial</option>
            </select>

            <button type="submit">Update Fee</button>

        </form>

        <h3 id="message"></h3>

        <a href="fees.html" class="back">← Back to All Fees</a>

    </div>

    <script>
        document.getElementById('updateForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const id = document.getElementById('fee_id').value;

            const data = {
                total_fee: document.getElementById('total_fee').value,
                paid_amount: document.getElementById('paid_amount').value,
                payment_date: document.getElementById('payment_date').value,
                payment_status: document.getElementById('payment_status').value
            };

            try {
                const response = await fetch('/fees/' + id, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.text();
                document.getElementById('message').innerText = result;

            } catch (error) {
                document.getElementById('message').innerText = 'Error updating fee!';
            }
        });
    </script>

</body>
</html>
