
<!DOCTYPE html>
<html>
<head>
    <title>Attendance Management | College Management System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #e9d5ff);
            margin: 0;
            padding: 25px;
            min-height: 100vh;
        }

        .navbar {
            background: #263b80;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 10px 13px;
            border-radius: 5px;
            font-size: 14px;
        }

        .navbar a:hover {
            background: #5268c5;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 500px;
            margin: 40px auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #263b80;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-top: 15px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #5268c5;
            box-shadow: 0 0 5px rgba(82,104,197,0.3);
        }

        button {
            width: 100%;
            background: #333399;
            color: white;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background: #5268c5;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
            color: #263b80;
        }

        .footer {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-top: 20px;
        }

        @media(max-width: 600px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 22px;
                margin: 25px auto;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="dashboard.html">Dashboard</a>
        <a href="student.html">Add Student</a>
        <a href="students.html">View Students</a>
        <a href="faculty.html">Add Faculty</a>
        <a href="faculties.html">View Faculty</a>
        <a href="course.html">Add Course</a>
        <a href="courses.html">View Courses</a>
        <a href="attendance.html">Add Attendance</a>
        <a href="attendances.html">View Attendance</a>
        <a href="fee.html">Add Fee</a>
        <a href="fees.html">View Fees</a>
    </nav>

    <div class="container">

        <h1>Student Attendance</h1>

        <form id="attendanceForm">

            <label>Student ID</label>
            <input type="number" id="student_id"
                placeholder="Enter Student ID" required min="1">

            <label>Attendance Date</label>
            <input type="date" id="attendance_date" required>

            <label>Attendance Status</label>
            <select id="status" required>
                <option value="">Select Attendance</option>
                <option value="Present">Present</option>
                <option value="Absent">Absent</option>
            </select>

            <button type="submit">Submit Attendance</button>

            <p id="message"></p>

        </form>

        <div class="footer">
            College Management System | Attendance Management
        </div>

    </div>

    <script>
        document.getElementById('attendanceForm')
        .addEventListener('submit', function(e) {

            e.preventDefault();

            const attendanceData = {
                student_id: document.getElementById('student_id').value,
                attendance_date: document.getElementById('attendance_date').value,
                status: document.getElementById('status').value
            };

            fetch('/attendance', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(attendanceData)
            })
            .then(response => response.text())
            .then(data => {
                document.getElementById('message').innerText = data;
            })
            .catch(error => {
                document.getElementById('message').innerText =
                    'Error adding attendance!';
                console.log(error);
            });

        });
    </script>

</body>
</html>
