
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | College Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #e0e7ff, #f3e8ff);
            min-height: 100vh;
            margin: 0;
            padding: 25px;
        }

        .navbar {
            background: #243b55;
            padding: 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 10px 13px;
            border-radius: 5px;
        }

        .navbar a:hover {
            background: #007bff;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            color: #243b55;
            margin-bottom: 25px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 5px rgba(79,70,229,0.3);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background: #3730a3;
        }

        .footer {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-top: 20px;
        }

        @media(max-width: 500px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Menu -->
    <nav class="navbar">
        <a href="dashboard.html">Dashboard</a>
        <a href="student.html">Add Student</a>
        <a href="students.html">View Students</a>
        <a href="faculty.html">Faculty</a>
        <a href="course.html">Courses</a>
        <a href="attendance.html">Attendance</a>
        <a href="fee.html">Fees</a>
    </nav>

    <!-- Student Registration Form -->
    <div class="container">

        <h2>Student Registration</h2>

        <p class="subtitle">College Management System</p>

        <form id="studentForm">

            <label>Roll Number</label>
            <input type="text" id="roll_no"
                placeholder="Enter Roll Number" required>

            <label>Student Name</label>
            <input type="text" id="student_name"
                placeholder="Enter Student Name" required>

            <label>Email</label>
            <input type="email" id="email"
                placeholder="Enter Email">

            <label>Phone Number</label>
            <input type="text" id="phone"
                placeholder="Enter Phone Number">

            <label>Department</label>
            <input type="text" id="department"
                placeholder="Enter Department">

            <label>Year</label>
            <input type="number" id="year"
                placeholder="Enter Year" min="1" required>

            <button type="submit">Register Student</button>

        </form>

        <div class="footer">
            © 2026 College Management System
        </div>

    </div>

    <!-- JavaScript -->
    <script>
        document.getElementById('studentForm')
        .addEventListener('submit', async function(e) {

            e.preventDefault();

            const student = {
                roll_no: document.getElementById('roll_no').value,
                student_name: document.getElementById('student_name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                department: document.getElementById('department').value,
                year: document.getElementById('year').value
            };

            try {
                const response = await fetch('/students', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(student)
                });

                const message = await response.text();

                alert(message);

                if (response.ok) {
                    document.getElementById('studentForm').reset();
                }

            } catch (error) {
                alert('Server connection failed!');
                console.error(error);
            }
        });
    </script>

</body>
</html>
