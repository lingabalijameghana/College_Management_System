
<!DOCTYPE html>
<html>
<head>
    <title>All Courses | College Management System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #e9d5ff);
            margin: 0;
            padding: 25px;
            min-height: 100vh;
        }

        .navbar {
            background: #263b80;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 10px 13px;
            border-radius: 5px;
            font-size: 14px;
        }

        .navbar a:hover {
            background: #5268c5;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #263b80;
            margin-bottom: 25px;
        }

        .refresh {
            display: block;
            margin: auto;
            padding: 12px 22px;
            background: #333399;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        .refresh:hover {
            background: #5268c5;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 25px;
        }

        table {
            width: 100%;
            min-width: 650px;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 14px;
            text-align: center;
        }

        th {
            background: #333399;
            color: white;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }

        tr:hover {
            background: #e8eaff;
        }

        .add-button {
            display: block;
            width: fit-content;
            margin: 25px auto 0;
            padding: 12px 22px;
            background: #263b80;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        .add-button:hover {
            background: #5268c5;
        }

        .footer {
            text-align: center;
            color: #777;
            margin-top: 25px;
            font-size: 13px;
        }

        @media(max-width: 600px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="dashboard.html">Dashboard</a>
        <a href="student.html">Add Student</a>
        <a href="students.html">View Students</a>
        <a href="faculty.html">Add Faculty</a>
        <a href="faculties.html">View Faculty</a>
        <a href="course.html">Add Course</a>
        <a href="courses.html">View Courses</a>
        <a href="attendance.html">Add Attendance</a>
        <a href="attendances.html">View Attendance</a>
        <a href="fee.html">Add Fee</a>
        <a href="fees.html">View Fees</a>
    </nav>

    <div class="container">

        <h1>All Courses Details</h1>

        <button class="refresh" onclick="loadCourses()">
            Refresh Course List
        </button>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Course ID</th>
                        <th>Course Name</th>
                        <th>Course Code</th>
                        <th>Department</th>
                        <th>Credits</th>
                    </tr>
                </thead>

                <tbody id="courseTable">
                    <tr>
                        <td colspan="5">Loading Courses...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a class="add-button" href="course.html">
            + Add New Course
        </a>

        <div class="footer">
            College Management System | Course Details
        </div>

    </div>

    <script>
        function loadCourses() {
            fetch('/courses')
                .then(response => response.json())
                .then(data => {
                    let rows = '';

                    data.forEach(course => {
                        rows += `
                            <tr>
                                <td>${course.course_id}</td>
                                <td>${course.course_name}</td>
                                <td>${course.course_code}</td>
                                <td>${course.department}</td>
                                <td>${course.credits}</td>
                            </tr>
                        `;
                    });

                    document.getElementById('courseTable').innerHTML =
                        rows || '<tr><td colspan="5">No Course Records Found</td></tr>';
                })
                .catch(error => {
                    document.getElementById('courseTable').innerHTML =
                        '<tr><td colspan="5">Unable to Load Courses</td></tr>';

                    console.log(error);
                });
        }

        loadCourses();
    </script>

</body>
</html>
