
<!DOCTYPE html>
<html>
<head>
    <title>Update Faculty</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #333399;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        label {
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #333399;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #222277;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Update Faculty Details</h2>

    <form id="updateForm">

        <label>Faculty ID</label>
        <input type="number" id="faculty_id" required>

        <label>Faculty Name</label>
        <input type="text" id="faculty_name" required>

        <label>Email</label>
        <input type="email" id="email">

        <label>Phone</label>
        <input type="text" id="phone">

        <label>Department</label>
        <input type="text" id="department">

        <label>Designation</label>
        <input type="text" id="designation">

        <button type="submit">Update Faculty</button>

    </form>

    <p id="message"></p>

</div>

<script>
    document.getElementById('updateForm').addEventListener('submit', function(e) {

        e.preventDefault();

        const id = document.getElementById('faculty_id').value;

        const facultyData = {
            faculty_name: document.getElementById('faculty_name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            department: document.getElementById('department').value,
            designation: document.getElementById('designation').value
        };

        fetch('/faculty/' + id, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(facultyData)
        })
        .then(response => response.text())
        .then(data => {
            document.getElementById('message').innerText = data;
        })
        .catch(error => {
            document.getElementById('message').innerText = 'Error updating faculty';
            console.log(error);
        });

    });
</script>

</body>
</html>
