
<!DOCTYPE html>
<html>
<head>
    <title>Faculty Details | College Management System</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 25px;
            background: linear-gradient(135deg, #dbeafe, #e9d5ff);
            min-height: 100vh;
        }

        .navbar {
            background: #263b80;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 10px 13px;
            border-radius: 5px;
            font-size: 14px;
        }

        .navbar a:hover {
            background: #5268c5;
        }

        .container {
            max-width: 1200px;
            margin: 35px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #263b80;
            margin-bottom: 25px;
        }

        .refresh {
            display: block;
            margin: auto;
            padding: 12px 22px;
            background: #333399;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        .refresh:hover {
            background: #5268c5;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 25px;
        }

        table {
            width: 100%;
            min-width: 750px;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 14px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #333399;
            color: white;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }

        tr:hover {
            background: #e8eaff;
        }

        .footer {
            text-align: center;
            color: #666;
            margin-top: 25px;
            font-size: 13px;
        }

        @media(max-width: 600px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="dashboard.html">Dashboard</a>
        <a href="student.html">Add Student</a>
        <a href="students.html">View Students</a>
        <a href="faculty.html">Add Faculty</a>
        <a href="faculties.html">View Faculty</a>
        <a href="course.html">Add Course</a>
        <a href="courses.html">View Courses</a>
        <a href="attendance.html">Add Attendance</a>
        <a href="attendances.html">View Attendance</a>
        <a href="fee.html">Add Fee</a>
        <a href="fees.html">View Fees</a>
    </nav>

    <div class="container">

        <h1>Faculty Details</h1>

        <button class="refresh" onclick="loadFaculty()">
            Refresh Faculty List
        </button>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Faculty ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Department</th>
                        <th>Designation</th>
                    </tr>
                </thead>

                <tbody id="facultyTable">
                    <tr>
                        <td colspan="6">Loading Faculty Details...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="footer">
            College Management System | Faculty Details
        </div>

    </div>

    <script>
        function loadFaculty() {
            fetch('/faculty')
            .then(response => response.json())
            .then(data => {
                let rows = '';

                data.forEach(faculty => {
                    rows += `
                        <tr>
                            <td>${faculty.faculty_id}</td>
                            <td>${faculty.faculty_name}</td>
                            <td>${faculty.email || ''}</td>
                            <td>${faculty.phone || ''}</td>
                            <td>${faculty.department || ''}</td>
                            <td>${faculty.designation || ''}</td>
                        </tr>
                    `;
                });

                document.getElementById('facultyTable').innerHTML =
                    rows || '<tr><td colspan="6">No Faculty Records Found</td></tr>';
            })
            .catch(error => {
                document.getElementById('facultyTable').innerHTML =
                    '<tr><td colspan="6">Error Loading Faculty Details</td></tr>';

                console.log(error);
            });
        }

        loadFaculty();
    </script>

</body>
</html>
