
<!DOCTYPE html>
<html>
<head>
    <title>Delete Faculty</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #333399;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 12px 0 20px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #d62828;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #a4161a;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Delete Faculty</h2>

    <form id="deleteForm">

        <label>Faculty ID to Delete</label>

        <input type="number" id="faculty_id"
               placeholder="Enter Faculty ID" required min="1">

        <button type="submit">Delete Faculty</button>

    </form>

    <p id="message"></p>

</div>

<script>
    document.getElementById('deleteForm').addEventListener('submit', function(e) {

        e.preventDefault();

        const id = document.getElementById('faculty_id').value;

        if (confirm('Are you sure you want to delete this faculty?')) {

            fetch('/faculty/' + id, {
                method: 'DELETE'
            })
            .then(response => response.text())
            .then(data => {
                document.getElementById('message').innerText = data;
            })
            .catch(error => {
                document.getElementById('message').innerText =
                    'Error deleting faculty';
                console.log(error);
            });

        }
    });
</script>

</body>
</html>
