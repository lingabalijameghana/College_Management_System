
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #101b3d, #245b83, #36a0a0);
            padding: 20px;
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #17375e;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #246b91;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 7px;
            background: #173f70;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #247c9b;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">🎓</div>

        <h2>College Management</h2>
        <p class="subtitle">Welcome to College Portal</p>

        <form id="loginForm">

            <label>Select Login Type</label>
            <select id="role" required>
                <option value="">Select Role</option>
                <option value="Admin">Admin</option>
                <option value="Faculty">Faculty</option>
                <option value="Student">Student</option>
            </select>

            <label>User ID</label>
            <input type="text" id="userid"
                   placeholder="Enter your User ID" required>

            <label>Password</label>
            <input type="password" id="password"
                   placeholder="Enter your Password" required>

            <button type="submit">Login</button>

        </form>

        <div class="footer">
            © 2026 College Management System
        </div>

    </div>

    <script>
        document.getElementById("loginForm")
        .addEventListener("submit", function(event) {
            event.preventDefault();
            alert("Login page is ready! Authentication will be connected next.");
        });
    </script>

</body>
</html>
