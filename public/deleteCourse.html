
<!DOCTYPE html>
<html>
<head>
    <title>Delete Course</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #243b64;
        }

        form {
            background: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
        }

        button {
            background: #d32f2f;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h1>Delete Course</h1>

    <form id="deleteForm">

        <input type="number" id="course_id"
            placeholder="Enter Course ID" required>

        <br>

        <button type="submit">Delete Course</button>

        <p id="message"></p>

    </form>

    <script>
        document.getElementById('deleteForm')
        .addEventListener('submit', function(e) {

            e.preventDefault();

            const id = document.getElementById('course_id').value;

            if (!confirm('Are you sure you want to delete this course?')) {
                return;
            }

            fetch('/courses/' + id, {
                method: 'DELETE'
            })
            .then(response => response.text())
            .then(data => {
                document.getElementById('message').innerText = data;
            })
            .catch(error => {
                document.getElementById('message').innerText =
                    'Error deleting course!';
                console.log(error);
            });

        });
    </script>

</body>
</html>
