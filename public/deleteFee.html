
<!DOCTYPE html>
<html>
<head>
    <title>Delete Fee | College Management System</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #e9d5ff);
            margin: 0;
            padding: 25px;
            min-height: 100vh;
        }

        .navbar {
            background: #312e81;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 10px 13px;
            border-radius: 6px;
            font-size: 14px;
        }

        .navbar a:hover {
            background: #6366f1;
        }

        .container {
            max-width: 500px;
            margin: 45px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            color: #b91c1c;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            margin-bottom: 22px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #dc2626;
            box-shadow: 0 0 5px rgba(220,38,38,0.3);
        }

        button {
            width: 100%;
            padding: 13px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #991b1b;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            color: #166534;
            font-size: 16px;
        }

        .warning {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 7px;
            font-size: 14px;
            text-align: center;
            margin-bottom: 22px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #4338ca;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="dashboard.html">Dashboard</a>
        <a href="student.html">Add Student</a>
        <a href="students.html">View Students</a>
        <a href="faculty.html">Add Faculty</a>
        <a href="faculties.html">View Faculty</a>
        <a href="course.html">Add Course</a>
        <a href="courses.html">View Courses</a>
        <a href="attendance.html">Add Attendance</a>
        <a href="attendances.html">View Attendance</a>
        <a href="fee.html">Add Fee</a>
        <a href="fees.html">View Fees</a>
    </nav>

    <div class="container">

        <h2>Delete Student Fee</h2>

        <div class="warning">
            Warning! Deleted fee records cannot be recovered.
        </div>

        <form id="deleteForm">

            <label>Fee ID to Delete:</label>
            <input type="number" id="fee_id" required min="1">

            <button type="submit">Delete Fee</button>

        </form>

        <h3 id="message"></h3>

        <a href="fees.html" class="back">← Back to All Fees</a>

    </div>

    <script>
        document.getElementById('deleteForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const id = document.getElementById('fee_id').value;

            if (!confirm('Are you sure you want to delete this fee?')) {
                return;
            }

            try {
                const response = await fetch('/fees/' + id, {
                    method: 'DELETE'
                });

                const result = await response.text();
                document.getElementById('message').innerText = result;

            } catch (error) {
                document.getElementById('message').innerText = 'Error deleting fee!';
            }
        });
    </script>

</body>
</html>
