
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Students | College Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #e0e7ff, #f3e8ff);
            padding: 25px;
            margin: 0;
        }

        /* Navigation Menu */
        .navbar {
            background: #243b55;
            padding: 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 10px 13px;
            border-radius: 5px;
        }

        .navbar a:hover {
            background: #007bff;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            color: #243b55;
            margin-bottom: 25px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
        }

        /* Table */
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
            min-width: 750px;
        }

        th, td {
            border: 1px solid #e2e8f0;
            padding: 14px;
            text-align: center;
        }

        th {
            background: #243b55;
            color: white;
        }

        tr:nth-child(even) {
            background: #f1f5f9;
        }

        tr:hover {
            background: #dbeafe;
        }

        /* Buttons */
        .buttons {
            text-align: center;
            margin-top: 25px;
        }

        .btn {
            display: inline-block;
            margin: 8px;
            padding: 12px 22px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

        .btn:hover {
            background: #3730a3;
        }

        .footer {
            text-align: center;
            color: #64748b;
            margin-top: 25px;
            font-size: 13px;
        }

        @media(max-width: 600px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Menu -->
    <nav class="navbar">
        <a href="dashboard.html">Dashboard</a>
        <a href="student.html">Add Student</a>
        <a href="students.html">View Students</a>
        <a href="faculty.html">Faculty</a>
        <a href="course.html">Courses</a>
        <a href="attendance.html">Attendance</a>
        <a href="fee.html">Fees</a>
    </nav>

    <!-- Main Container -->
    <div class="container">

        <h2>All Students Details</h2>

        <p class="subtitle">
            College Management System - Student Records
        </p>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Roll No</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Department</th>
                        <th>Year</th>
                    </tr>
                </thead>

                <tbody id="studentData"></tbody>
            </table>
        </div>

        <!-- Buttons -->
        <div class="buttons">
            <a href="student.html" class="btn">+ Add Student</a>
            <a href="update.html" class="btn">Update Student</a>
            <a href="delete.html" class="btn">Delete Student</a>
        </div>

        <div class="footer">
            © 2026 College Management System
        </div>

    </div>

    <!-- JavaScript -->
    <script>
        async function loadStudents() {
            try {
                const response = await fetch('/students');

                if (!response.ok) {
                    throw new Error('Unable to load students');
                }

                const students = await response.json();
                const table = document.getElementById('studentData');

                table.innerHTML = '';

                students.forEach(student => {
                    const row = document.createElement('tr');

                    [
                        student.student_id,
                        student.roll_no,
                        student.student_name,
                        student.email,
                        student.phone,
                        student.department,
                        student.year
                    ].forEach(value => {
                        const cell = document.createElement('td');
                        cell.textContent = value ?? '';
                        row.appendChild(cell);
                    });

                    table.appendChild(row);
                });

                if (students.length === 0) {
                    table.innerHTML =
                        '<tr><td colspan="7">No Students Found</td></tr>';
                }

            } catch (error) {
                alert(error.message);
            }
        }

        loadStudents();
    </script>

</body>
</html>
